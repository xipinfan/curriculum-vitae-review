services:
  postgres:
    image: postgres:16
    container_name: cv-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cv_review}
      POSTGRES_USER: ${POSTGRES_USER:-cv_review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cv_review_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - cv_review_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cv_review}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cv-review-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cv_review}:${POSTGRES_PASSWORD:-cv_review_dev}@postgres:5432/${POSTGRES_DB:-cv_review}
      ADMIN_KEY: ${ADMIN_KEY:-replace_with_a_secure_random_key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_with_real_key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cv-review-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  cv_review_pg_data:
